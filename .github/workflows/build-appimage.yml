name: Build MeshCore Open AppImage

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Get latest upstream release tag
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api repos/zjs81/meshcore-open/releases/latest --jq .tag_name)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Upstream latest tag: $TAG"

      - name: Check if we already released this tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Scheduled runs: skip when this tag is already published.
          # Manual "Run workflow": always build (e.g. to pick up packaging fixes).
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Manual run; building ${{ steps.upstream.outputs.tag }}."
            exit 0
          fi

          if gh release view "${{ steps.upstream.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Already have release ${{ steps.upstream.outputs.tag }}; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No release for ${{ steps.upstream.outputs.tag }}; will build."
          fi

      - name: Install build deps
        if: steps.check.outputs.exists == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip fuse libfuse2 python3 \
            git clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Setup Flutter
        if: steps.check.outputs.exists == 'false'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build AppImage from patched upstream source
        if: steps.check.outputs.exists == 'false'
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x build-appimage.sh strip_nags.py
          python3 test_strip_nags.py
          ./build-appimage.sh

      - name: Publish GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          FILE="MeshcoreOpen-x86_64.AppImage"
          test -f "$FILE"
          test -f "${FILE}.zsync"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # Manual rebuild of an existing tag: replace assets in place.
            gh release upload "$TAG" "$FILE" "${FILE}.zsync" \
              --repo "${{ github.repository }}" \
              --clobber
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --notes "Nag-stripped AppImage rebuilt from zjs81/meshcore-open \`$TAG\` source (shop banner and map-contribute prompt removed)."
          else
            gh release create "$TAG" "$FILE" "${FILE}.zsync" \
              --repo "${{ github.repository }}" \
              --title "MeshCore Open $TAG" \
              --notes "Nag-stripped AppImage built from zjs81/meshcore-open \`$TAG\` source (shop banner and map-contribute prompt removed)."
          fi
